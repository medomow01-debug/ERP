<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>الرئيسية</title><link rel=stylesheet href=style.css><script src=https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js></script><script src=app.js></script></head><body><div id=nav></div><main id=app></main><script>
let D={};
async function load(){const [t,tr,b,i,ts]=await Promise.all([all('treasury_tx?select=kind,amount&order=id'),all('transfers?select=dir,amount&order=id'),all('stock_balance'),api('installments?paid=eq.false&select=id,due_date'),api('sales_invoices?date=eq.'+td()+'&select=total')]);D={t,tr,b,i,ts}}
function render(){const bal=sum(D.t,x=>x.kind=='in'?x.amount:-x.amount),tb=sum(D.tr,x=>x.dir=='in'?x.amount:-x.amount);
 $('#app').innerHTML=`<div class="cards"><div>رصيد الخزينة<b>${fm(bal)}</b></div><div>رصيد التحويلات<b>${fm(tb)}</b></div><div>أصناف قاربت على النفاذ<b>${D.b.filter(x=>x.qty<=x.min_qty).length}</b></div><div>دفعات مستحقة<b>${D.i.filter(x=>x.due_date<=td()).length}</b></div><div>مبيعات اليوم<b>${fm(sum(D.ts,x=>x.total))}</b></div></div>`}
boot('index').then(async()=>{await load();render()});
</script></body></html>
